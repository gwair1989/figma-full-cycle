interface:
  display_name: "Figma Full Cycle"
  short_description: "Figma frame → a feature built to the project's conventions"
  default_prompt: "Use $figma-full-cycle to implement a feature end-to-end from a parent Figma frame. First discover the tools actually installed (skills, MCP servers and tools, plugins, project scripts). Resolve the project architecture from documentation or an explicit user decision before binding app-architecture; ask the user when documentation is missing, ambiguous or contradictory, including in ui-first. Then audit the project's Strings, Typography, Colors, Images, and Accessibility conventions, probe Figma auth and that the pinned node reads, and bind one compatible candidate per stage role; never call a tool name that did not appear in the sweep. Resolve Strings from project documentation before a compact catalog inventory; never load full catalogs. Add Accessibility only when project documentation or the user explicitly requires it."
