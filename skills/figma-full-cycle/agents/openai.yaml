interface:
  display_name: "Figma Full Cycle"
  short_description: "Figma frame → a feature built to the project's conventions"
  default_prompt: "Use $figma-full-cycle to implement a feature end-to-end from a parent Figma frame. First discover the tools actually installed (skills, MCP servers and tools, plugins, project scripts), probe Figma auth and that the pinned node reads, and bind one candidate per stage role; never call a tool name that did not appear in that sweep. Then audit the project's Strings, Typography, Colors, Images, and Accessibility conventions. Resolve Strings from project documentation before a compact catalog inventory; never load full catalogs. Add Accessibility only when project documentation or the user explicitly requires it."
