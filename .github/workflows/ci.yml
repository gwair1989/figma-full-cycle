name: CI

# Python validator suites run locally — see ./check.sh and tools/pre-push.
# CI checks package/installer behavior, the portable evidence helper, and skill structure.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Skill structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Lint skill frontmatter and links
        run: python3 tools/lint_skills.py
      - name: Check shell script syntax
        run: bash -n install.sh && bash -n check.sh
      - name: Check plugin package and standalone installation
        run: python3 -m unittest discover -s tools/tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test device screenshot evidence recorder
        run: node --test skills/device-usage/scripts/capture-evidence.test.mjs
