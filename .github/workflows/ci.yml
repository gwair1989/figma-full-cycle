name: CI

# Validator tests run locally — see ./check.sh and tools/pre-push.
# CI only guards what a reviewer cannot eyeball in a diff: skill structure and
# relative links across every skill document.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Skill structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Lint skill frontmatter and links
        run: python3 tools/lint_skills.py
      - name: Check shell script syntax
        run: bash -n install.sh && bash -n check.sh
